name: player_tv
description: XPlayer Android TV client (D-pad UI).
publish_to: "none"
version: 6.0.36+146

environment:
  sdk: ^3.13.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Keep the screen on during playback.
  wakelock_plus: ^1.8.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.3
  qr_flutter: ^4.1.0
  design_system:
    path: ../../packages/design_system
  domain:
    path: ../../packages/domain
  data:
    path: ../../packages/data
  audioplayers: ^6.8.1
  video_player: ^2.14.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  package_info_plus: ^10.2.1
  http: ^1.6.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/audio/chime.mp3

flutter_launcher_icons:
  android: true
  ios: false
  # Same master as current iPhone AppIcon (proportions/spacing locked).
  image_path: ../../packages/design_system/assets/branding/xplayer_launcher.png
  adaptive_icon_background: "#0B0B12"
  adaptive_icon_foreground: ../../packages/design_system/assets/branding/xplayer_launcher_fg.png
  # Adaptive icons show only the centre 72 of 108 dp (a round mask: a 66 dp
  # safe circle). With 18 the frame corners were cut on round-mask TV
  # launchers; 23 keeps the whole approved framed icon inside the circle.
  adaptive_icon_foreground_inset: 23
  min_sdk_android: 21
  web:
    generate: false
  macos:
    generate: false
  windows:
    generate: false

# Color-only + explicit splash mark (not launcher) for Android 12+.
flutter_native_splash:
  color: "#0B0B12"
  android_12:
    color: "#0B0B12"
    icon_background_color: "#0B0B12"
    image: ../../packages/design_system/assets/branding/xplayer_splash.png
  ios: false
  android: true
  fullscreen: true
  android_gravity: center
