name: player_mobile
description: XPlayer media player for Android and iOS.
publish_to: "none"
version: 6.0.36+145

environment:
  sdk: ^3.13.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Keep the screen on during playback.
  wakelock_plus: ^1.8.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  flutter_native_splash: ^2.4.6
  design_system:
    path: ../../packages/design_system
  domain:
    path: ../../packages/domain
  data:
    path: ../../packages/data
  audioplayers: ^6.8.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.11
  permission_handler: ^12.0.1
  video_player: ^2.14.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  package_info_plus: ^10.2.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/chime.mp3
    - assets/audio/unlock.mp3

flutter_launcher_icons:
  android: true
  ios: true
  # App icon source: packages/design_system/assets/branding (tool/branding/make_xplayer_brand.py).
  # Same art on Android, iPhone and TV.
  image_path: ../../packages/design_system/assets/branding/xplayer_launcher.png
  adaptive_icon_background: "#0D0607"
  adaptive_icon_foreground: ../../packages/design_system/assets/branding/xplayer_launcher_fg.png
  # The frame reaches the edges: Android masks show the centre 72 of 108 dp,
  # so 18% keeps the whole frame inside the mask (as on TV).
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true
  background_color_ios: "#0D0607"
  web:
    generate: false
  macos:
    generate: false

# Color-only native splash so Android 12+ does not enlarge the launcher icon
# as a pre-splash. Flutter SplashScreen paints the brand mark.
flutter_native_splash:
  color: "#0D0607"
  # Android 12+ styles point to @drawable/splash_blank (no static
  # logo before the animation). Re-running flutter_native_splash resets
  # values-v31/styles.xml: put splash_blank back afterwards.
  android_12:
    color: "#0D0607"
    icon_background_color: "#0D0607"
    # Explicit splash mark (not launcher) — prevents full-screen icon zoom.
    image: ../../packages/design_system/assets/branding/xplayer_splash.png
  ios: true
  android: true
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
